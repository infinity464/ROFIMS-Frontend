<p-fluid>
  <div class="card">
    <div class="ns-gen-header">
      <div class="ns-gen-title">{{ title }}</div>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="ns-gen-grid">
        <!-- Text Type -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Text Type</label>
          <p-select
            formControlName="textType"
            [options]="textTypeOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Select Language"
            (onChange)="onTextTypeChange()"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Date -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Date <span class="ns-gen-req">*</span></label>
          <p-datepicker formControlName="noteSheetDate" dateFormat="dd/mm/yy" styleClass="w-full" placeholder="Select date"></p-datepicker>
        </div>

        <!-- Reference Number -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Reference Number</label>
          <input pInputText formControlName="referenceNumber" placeholder="Enter reference number" class="w-full" />
        </div>

        <!-- Note Sheet No -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Note Sheet No</label>
          <input pInputText formControlName="noteSheetNo" placeholder="Auto generated" class="w-full" />
        </div>

        <!-- Unit -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Unit</label>
          <p-select
            formControlName="unitId"
            [options]="unitOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Unit"
            (onChange)="onUnitChange()"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Wing/Battalion -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Wing/Battalion</label>
          <p-select
            formControlName="wingBattalionId"
            [options]="wingOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Wing"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Branch -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Branch</label>
          <p-select
            formControlName="branchId"
            [options]="branchOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Branch"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Subject -->
        <div class="ns-gen-field ns-gen-span-2">
          <label class="ns-gen-label">Subject <span class="ns-gen-req">*</span></label>
          <input pInputText formControlName="subject" placeholder="Enter subject" class="w-full" />
          @if (form.get('subject')?.invalid && form.get('subject')?.touched) {
            <small class="ns-gen-error">Subject is required</small>
          }
        </div>

        <!-- Main Text (full row) -->
        <div class="ns-gen-field ns-gen-full">
          <label class="ns-gen-label">Main Text</label>
          <app-rich-editor formControlName="mainText" height="220px" placeholder="Write content here..."></app-rich-editor>
        </div>

        <!-- Prepared By -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Prepared By</label>
          @if (isPreparedByMapped) {
            <input pInputText formControlName="preparedBy" readonly class="w-full" />
          } @else {
            <p-select
              formControlName="preparedByEmployeeId"
              [options]="initiatorOptionsDisplay"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              [showClear]="true"
              placeholder="Select Prepared By"
              styleClass="w-full">
            </p-select>
          }
        </div>

        <!-- Initiator -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Initiator</label>
          <p-select
            formControlName="initiatorId"
            [options]="initiatorOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Initiator"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Final Approver -->
        <div class="ns-gen-field">
          <label class="ns-gen-label">Final Approver</label>
          <p-select
            formControlName="finalApproverId"
            [options]="finalApproverOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Final Approver"
            styleClass="w-full">
          </p-select>
        </div>

        <!-- Recommenders (full row) -->
        <div class="ns-gen-field ns-gen-full">
          <label class="ns-gen-label">Recommender(s)</label>
          <p-multiselect
            formControlName="recommenderIds"
            [options]="recommenderOptionsDisplay"
            optionLabel="label"
            optionValue="value"
            [filter]="true"
            filterBy="label"
            [showClear]="true"
            placeholder="Select Recommender(s)"
            styleClass="w-full">
          </p-multiselect>
          @if (getSelectedRecommenderNames().length > 0) {
            <div class="ns-gen-chips">
              @for (name of getSelectedRecommenderNames(); track name) {
                <span class="ns-gen-chip">{{ name }}</span>
              }
            </div>
          }
        </div>

        <!-- Supporting Documents (full row) -->
        <div class="ns-gen-field ns-gen-full">
          <label class="ns-gen-label">Supporting Documents</label>
          <app-file-references-form
            #fileReferencesForm
            [fileRows]="fileRows"
            [isViewMode]="false"
            title="Supporting Documents"
            (fileRowsChange)="onFileRowsChange($event)"
            (onDownloadFile)="onDownloadFile($event)">
          </app-file-references-form>
        </div>
      </div>

      <!-- Actions -->
      <div class="ns-gen-actions">
        <p-button type="submit" label="Generate Note Sheet" icon="pi pi-check" [loading]="isSubmitting" [disabled]="form.invalid" />
      </div>
    </form>
  </div>

  <p-toast></p-toast>
</p-fluid>
