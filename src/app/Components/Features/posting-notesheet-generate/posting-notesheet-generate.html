<p-toast></p-toast>

<p-fluid>
  <div class="form-card">
    <div class="form-card-header">
      <h3 class="form-card-title">{{ title }}</h3>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-section">
        <!-- Row 1: Draft Posting List No, Text Type, Date -->
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Draft Posting List No <span class="form-label-required">*</span></label>
            <p-select
              formControlName="draftPostingMasterId"
              [options]="draftPostingOptions"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              placeholder="Search & Select"
              [loading]="loadingDraftList"
              [showClear]="true"
              styleClass="w-full">
            </p-select>
            @if (form.get('draftPostingMasterId')?.invalid && form.get('draftPostingMasterId')?.touched) {
              <small class="form-error">Draft Posting List is required</small>
            }
          </div>
          <div class="form-field">
            <label class="form-label">Note-Sheet Text Type</label>
            <p-select
              formControlName="textType"
              [options]="textTypeOptions"
              optionLabel="label"
              optionValue="value"
              styleClass="w-full">
            </p-select>
          </div>
          <div class="form-field">
            <label class="form-label">Select Date <span class="form-label-required">*</span></label>
            <p-datepicker formControlName="noteSheetDate" dateFormat="dd/mm/yy" styleClass="w-full" placeholder="Select Date" appendTo="body"></p-datepicker>
            @if (form.get('noteSheetDate')?.invalid && form.get('noteSheetDate')?.touched) {
              <small class="form-error">Date is required</small>
            }
          </div>
        </div>

        <!-- Row 2: Reference Number, Prepared by, Initiator -->
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Reference Number</label>
            <input pInputText class="w-full" formControlName="referenceNumber" placeholder="Auto / Manual" />
          </div>
          <div class="form-field">
            <label class="form-label">Prepared by</label>
            <input pInputText class="w-full" formControlName="preparedBy" readonly />
          </div>
          <div class="form-field">
            <label class="form-label">Select Initiator</label>
            <p-select
              formControlName="initiatorId"
              [options]="initiatorOptionsDisplay"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              placeholder="Search & Select"
              [showClear]="true"
              styleClass="w-full">
            </p-select>
          </div>
        </div>

        <!-- Row 3: Recommender's, Final Approver -->
        <div class="form-row">
          <div class="form-field">
            <label class="form-label">Select Recommender's (If Applicable)</label>
            <p-multiselect
              formControlName="recommenderIds"
              [options]="recommenderOptionsDisplay"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              placeholder="Search & Select"
              [showClear]="true"
              styleClass="w-full">
            </p-multiselect>
          </div>
          <div class="form-field">
            <label class="form-label">Select Final Approver</label>
            <p-select
              formControlName="finalApproverId"
              [options]="finalApproverOptionsDisplay"
              optionLabel="label"
              optionValue="value"
              [filter]="true"
              filterBy="label"
              placeholder="Search & Select"
              [showClear]="true"
              styleClass="w-full">
            </p-select>
          </div>
        </div>

        <!-- Row 4: Main Text (full width) -->
        <div class="form-row">
          <div class="form-field" style="flex-basis: 100%">
            <label class="form-label">Main Text</label>
            <p-editor formControlName="mainText" [style]="{ height: '220px' }" placeholder="Add content using the text editor..."></p-editor>
          </div>
        </div>

        <!-- Row 5: Note (full width) -->
        <div class="form-row">
          <div class="form-field" style="flex-basis: 100%">
            <label class="form-label">Note/Remarks</label>
            <textarea pInputTextarea formControlName="note" rows="3" class="w-full" placeholder="Enter note..."></textarea>
          </div>
        </div>

        <!-- Row 6: Supporting Document (full width) -->
        <div class="form-row">
          <div class="form-field" style="flex-basis: 100%">
            <label class="form-label">Upload Supporting Document</label>
            <app-file-references-form
              #fileReferencesForm
              [fileRows]="fileRows"
              [isViewMode]="false"
              title="Supporting Document"
              (fileRowsChange)="onFileRowsChange($event)"
              (onDownloadFile)="onDownloadFile($event)">
            </app-file-references-form>
          </div>
        </div>
      </div>

      <div class="form-actions">
        <p-button type="submit" label="Generate Note Sheet" icon="pi pi-file-edit" [loading]="isSubmitting" [disabled]="form.invalid" />
      </div>
    </form>
  </div>
</p-fluid>
