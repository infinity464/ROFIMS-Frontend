<div class="member-card" [routerLink]="['/members/profile', member.employeeID]">
    <div class="rank-label">{{ member.armyRank }}</div>
    <div class="name-row">
        <span class="name">{{ member.nameEnglish }}</span>
        <span class="ids">
            @if ((member.rabID || member.rabId) && member.rabID !== 'null' && member.rabId !== 'null') {
                (RAB ID : {{ member.rabID || member.rabId }} | Service ID : {{ member.serviceId }})
            } @else {
                (Service ID : {{ member.serviceId }})
            }
        </span>
    </div>
</div>
