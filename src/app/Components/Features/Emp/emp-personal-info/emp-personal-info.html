<p-fluid>
    <div class="form-card">
        @if (!hideTitle) {
            <div class="form-card-header">
                <h3 class="form-card-title">Employee Personal Info</h3>
            </div>
        }

        <!-- Employee Search Section - hidden only when embedded in another page/tab -->
        @if (!embedMode && !hideTitle) {
            <div class="form-section">
                <app-employee-search
                    [exMemberNotice]="true"
                    (onEmployeeFound)="onEmployeeSearchFound($event)"
                    (onSearchReset)="onEmployeeSearchReset()">
                </app-employee-search>
            </div>
        }

        <!-- Personal Information Form -->
        @if (employeeFound) {
            <form [formGroup]="personalInfoForm">
                <div class="form-section">
                    @if (mode === 'view') {
                        <div class="flex justify-end mb-3">
                            <p-button
                                label="Edit"
                                icon="pi pi-pencil"
                                [class.perm-hidden]="!canUpdate"
                                (onClick)="enableEditMode()">
                            </p-button>
                        </div>
                    }
                    <!-- Row 1: Blood Group, NID Old, New NID, Mobile No Personal, Mobile No Official, Email Address -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Blood Group</label>
                            <p-select formControlName="bloodGroup" [options]="bloodGroups" optionLabel="label" optionValue="value" placeholder="Select Blood Group" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">New NID</label>
                            <input pInputText class="w-full" placeholder="Only Number" formControlName="nid" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Old NID</label>
                            <input pInputText class="w-full" placeholder="Only Number" formControlName="nidOld" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Mobile No Personal</label>
                            <input pInputText class="w-full" placeholder="Mobile Number" formControlName="mobileNo" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Mobile No Official</label>
                            <input pInputText class="w-full" placeholder="Mobile Number" formControlName="mobileNoOfficial" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Email Address</label>
                            <input pInputText class="w-full" placeholder="Valid Email" formControlName="emailAddress" />
                        </div>
                    </div>

                    <!-- Row 2: DOB, Religion, Passport No, Identification Mark -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Date of Birth</label>
                            <p-datepicker formControlName="dateOfBirth" dateFormat="dd-mm-yy" placeholder="Select Date" styleClass="w-full"></p-datepicker>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Religion</label>
                            <p-select formControlName="religion" [options]="religions" optionLabel="label" optionValue="value" placeholder="Select Religion" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Passport No</label>
                            <input pInputText class="w-full" placeholder="Only Number" formControlName="passportNo" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Identification Mark</label>
                            <input pInputText class="w-full" placeholder="Enter Identification Mark" formControlName="identificationMark" />
                        </div>
                    </div>

                    <!-- Row 3: Emergency Contact, Date of Joining, Date of Commission -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Emergency Contact No</label>
                            <input pInputText class="w-full" placeholder="Mobile Number" formControlName="emergencyContactNo" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Date of Joining in Service/Training</label>
                            <p-datepicker formControlName="dateOfJoining" dateFormat="dd-mm-yy" placeholder="Select Date" styleClass="w-full"></p-datepicker>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Date of Commission</label>
                            <p-datepicker formControlName="dateOfCommission" dateFormat="dd-mm-yy" placeholder="Select Date" styleClass="w-full"></p-datepicker>
                        </div>
                    </div>

                    <!-- Row 4: Investigation Experience (Batch moved to emp-basic-info) -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Investigation Experience</label>
                            <div class="flex gap-4 h-full align-items-center pt-2">
                                @for (option of yesNoOptions; track option.value) {
                                    <div class="flex align-items-center">
                                        <p-radioButton [inputId]="'invExp' + option.label" formControlName="investigationExperience" [value]="option.value"></p-radioButton>
                                        <label [for]="'invExp' + option.label" class="ml-2 text-sm">{{ option.label }}</label>
                                    </div>
                                }
                            </div>
                        </div>
                    </div>

                    <!-- Investigation Details (conditional) -->
                    @if (showInvestigationExperience) {
                        <div class="form-row">
                            <div class="form-field" style="min-width: 100%;">
                                <label class="form-label">Investigation Experience Details</label>
                                <textarea pTextarea formControlName="investigationExperienceDetails" rows="2" class="w-full" placeholder="Write about investigation experience in brief..."></textarea>
                            </div>
                        </div>
                    }

                    <!-- Row 5: Professional Qualification, Personal Qualification, Gallantry Awards, Last Education -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Professional Qualification</label>
                            <p-multiSelect formControlName="professionalQualification" [options]="professionalQualifications" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true" display="chip"></p-multiSelect>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Personal Qualification</label>
                            <p-multiSelect formControlName="personalQualification" [options]="personalQualifications" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true" display="chip"></p-multiSelect>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Gallantry Awards/Decoration</label>
                            <p-multiSelect formControlName="gallantryAward" [options]="gallantryAwards" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true" display="chip"></p-multiSelect>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Last Education Qualification</label>
                            <p-select formControlName="lastEducationQualification" [options]="educationQualifications" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                    </div>

                    <!-- Row 6: Medical Category, Tribal, Freedom Fighter, Height -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Medical Category <span class="form-label-required">*</span></label>
                            <p-select formControlName="medicalCategory" [options]="medicalCategories" optionLabel="label" optionValue="value" placeholder="Select Medical Category" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Tribal</label>
                            <p-select formControlName="tribal" [options]="tribalOptions" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Freedom Fighter</label>
                            <p-select formControlName="freedomFighter" [options]="freedomFighterOptions" optionLabel="label" optionValue="value" placeholder="Select" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Height</label>
                            <div class="flex gap-2 align-items-center">
                                <p-inputNumber formControlName="heightFeet" [min]="0" [max]="8" placeholder="Feet" styleClass="flex-1"></p-inputNumber>
                                <span class="text-sm">Ft</span>
                                <p-inputNumber formControlName="heightInch" [min]="0" [max]="11.5" [minFractionDigits]="0" [maxFractionDigits]="1" placeholder="Inch" styleClass="flex-1"></p-inputNumber>
                                <span class="text-sm">In</span>
                            </div>
                        </div>
                    </div>

                    <!-- Row 7: Weight, Leaving Status, Driving License, Service ID Card -->
                    <div class="form-row">
                        <div class="form-field">
                            <label class="form-label">Weight</label>
                            <div class="flex gap-2 align-items-center">
                                <p-inputNumber formControlName="weightKg" [min]="0" placeholder="KG" styleClass="flex-1"></p-inputNumber>
                                <span class="text-sm">KG</span>
                                <p-inputNumber formControlName="weightLbs" [min]="0" placeholder="Lbs" styleClass="flex-1"></p-inputNumber>
                                <span class="text-sm">Lbs</span>
                            </div>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Leaving Status</label>
                            <p-select formControlName="leavingStatus" [options]="leavingStatusOptions" optionLabel="label" optionValue="value" placeholder="Select Leaving Status" styleClass="w-full"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Present Status</label>
                            <p-select formControlName="presentStatus" [options]="presentStatusTypes" optionLabel="label" optionValue="value" placeholder="Select Present Status" styleClass="w-full" [filter]="true"></p-select>
                        </div>
                        <div class="form-field">
                            <label class="form-label">Driving License No</label>
                            <input pInputText class="w-full" placeholder="Enter Driving License No" formControlName="drivingLicenseNo" />
                        </div>
                        <div class="form-field">
                            <label class="form-label">Service ID Card No</label>
                            <input pInputText class="w-full" placeholder="Enter Service ID Card No" formControlName="serviceIdCardNo" />
                        </div>
                    </div>
                </div>

                <!-- File References Section -->
                <div class="form-section file-section-compact">
                    <app-file-references-form
                        #fileReferencesForm
                        [fileRows]="fileRows"
                        [isViewMode]="isReadonly"
                        title="Supporting Documents"
                        (fileRowsChange)="onFileRowsChange($event)"
                        (onDownloadFile)="onDownloadFile($event)">
                    </app-file-references-form>
                </div>
            </form>

            <!-- Action Buttons -->
            @if (mode !== 'view') {
                <div class="form-actions">
                    @if (mode === 'edit') {
                        <p-button
                            type="button"
                            label="Cancel"
                            icon="pi pi-times"
                            severity="secondary"
                            [outlined]="true"
                            styleClass="form-btn-secondary"
                            (onClick)="goBack()">
                        </p-button>
                    } @else {
                        <!-- <p-button
                            type="button"
                            label="Reset"
                            icon="pi pi-refresh"
                            severity="secondary"
                            [outlined]="true"
                            styleClass="form-btn-secondary"
                            (onClick)="resetForm()">
                        </p-button> -->
                    }
                    <p-button
                        type="button"
                        label="Save All Information"
                        icon="pi pi-check-circle"
                        styleClass="form-btn-primary"
                        (onClick)="saveAll()">
                    </p-button>
                </div>
            }
        }
    </div>
</p-fluid>
