<div class="tree-node">
    <!-- Read-only organogram: expand on chevron; select on label -->
    <ng-container *ngIf="readOnly">
        <div class="tree-node-content tree-node-readonly" [class.node-selected]="isSelected">
            <span class="expand-toggle" *ngIf="hasChildrenOrCanExpand" (click)="onExpandAreaClick($event)">
                <i class="pi pi-spin pi-spinner" *ngIf="loadingParentId === node.id"></i>
                <i class="pi pi-chevron-right expand-icon" [class.expanded]="node.expanded" *ngIf="loadingParentId !== node.id"></i>
            </span>
            <span class="expand-placeholder" *ngIf="!hasChildrenOrCanExpand"></span>
            <div class="node-readonly-label" (click)="onReadOnlyLabelClick($event)">
                <span class="level-badge" [style.background-color]="badgeColor">{{ node.id === -1 ? 'S' : (node.id === -2 ? 'P' : node.codeType) }}</span>

                <span class="node-name">{{ node.nameEN || node.commCode }}</span>
                <ng-container *ngIf="node.id < 0">
                    <span class="count-badge virtual-node" *ngIf="node.servingCount != null && node.servingCount > 0">
                        ({{ node.servingCount }})
                    </span>
                </ng-container>
                <ng-container *ngIf="node.id >= 0">
                    <span class="count-badge" *ngIf="(node.authorizedCount != null && node.authorizedCount > 0) || (node.servingCount != null && node.servingCount > 0)">
                        <span class="auth-count" *ngIf="node.authorizedCount && node.authorizedCount > 0">A: {{ node.authorizedCount }}</span>
                        <span class="held-count" *ngIf="node.servingCount && node.servingCount > 0">H: {{ node.servingCount }}</span>
                    </span>
                </ng-container>

                <span class="node-comm" *ngIf="node.id >= 0 && node.commCode">({{ node.commCode }})</span>
            </div>
        </div>
    </ng-container>

    <!-- Editable org setup -->
    <ng-container *ngIf="!readOnly">
        <div class="tree-node-content" (click)="toggleExpand()">
            <span class="expand-toggle" *ngIf="hasChildrenOrCanExpand">
                <i class="pi pi-spin pi-spinner" *ngIf="loadingParentId === node.id"></i>
                <i class="pi pi-chevron-right expand-icon" [class.expanded]="node.expanded" *ngIf="loadingParentId !== node.id"></i>
            </span>
            <span class="expand-placeholder" *ngIf="!hasChildrenOrCanExpand"></span>
            <span class="level-badge" [style.background-color]="badgeColor">{{ node.codeType }}</span>
            <span class="node-name">{{ node.nameEN || node.commCode }}</span>
            <span class="node-comm" *ngIf="node.commCode">({{ node.commCode }})</span>
            <div class="node-actions" (click)="$event.stopPropagation()">
                <button *ngIf="canAddChild" pButton type="button" icon="pi pi-plus" class="p-button-text p-button-sm p-button-success" pTooltip="Add Child" (click)="onAddChild($event)"></button>
                <button pButton type="button" icon="pi pi-pencil" class="p-button-text p-button-sm p-button-info" pTooltip="Edit" (click)="onEdit($event)"></button>
                <button pButton type="button" icon="pi pi-trash" class="p-button-text p-button-sm p-button-danger" pTooltip="Delete" (click)="onDelete($event)"></button>
            </div>
        </div>
    </ng-container>

    <div class="tree-node-children" *ngIf="node.expanded !== false && node.children?.length">
        <app-tree-node
            *ngFor="let child of node.children; trackBy: trackById"
            [node]="child"
            [depth]="depth + 1"
            [loadingParentId]="loadingParentId"
            [readOnly]="readOnly"
            [selectedNodeId]="selectedNodeId"
            (addChild)="addChild.emit($event)"
            (edit)="edit.emit($event)"
            (delete)="delete.emit($event)"
            (expandRequest)="expandRequest.emit($event)"
            (expandToggled)="expandToggled.emit($event)"
            (nodeSelect)="nodeSelect.emit($event)"
        >
        </app-tree-node>
    </div>
</div>
