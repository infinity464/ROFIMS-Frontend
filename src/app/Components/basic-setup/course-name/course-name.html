
<p-fluid>
    <div class="card">
        <div class="font-semibold text-xl mb-5">{{ title }} Setup</div>



<app-dynamic-form
            [config]="formConfig"
            [form]="commonCodeForm"
            [editingId]="editingId"
            (save)="submit($event)"
            (reset)="resetForm()"
            [isSubmitting]="isSubmitting"
            [canInsert]="canInsert"
            [canUpdate]="canUpdate">
        </app-dynamic-form>
          </div>
</p-fluid>

        <app-data-table
            [config]="tableConfig"
            [data]="commonCodeData"
            [first]="first"
            [totalRecords]="totalRecords"
            [rows]="rows"
            [loading]="loading"
            (edit)="update($event)"
             (delete)="delete($event.row, $event.event)"
            [lazy]="false"
            (search)="onSearch($event)"
    [canUpdate]="canUpdate" [canDelete]="canDelete">
        </app-data-table>
